name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # A network server: socket timing, TLS and process signals are where
        # platforms disagree, so the suite runs on all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: 89fd7f4bb5af43ae79bf24405dab022a05e3161c
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: 89fd7f4bb5af43ae79bf24405dab022a05e3161c
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            9385be8a31ce484a7f60346e525f4dd655e7d40f2d977fc306bcd2bdb3a54966  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # BRIDGE until fancy-ws 0.2.0 is on npm: package-lock.json resolves it
      # to a tarball built from a pinned commit (fancy-ws-candidate.json).
      # Delete this step with the bridge.
      - name: Build the fancy-ws candidate
        run: node scripts/fancy-ws-candidate.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx tsup

      # The suite imports src/; this imports dist/ through both entry points and
      # runs the CLI binary, as a consumer and a CI step would.
      - name: Smoke-test the built artifact
        run: node scripts/smoke.mjs

  # The HTTP API against fancy-cowork-php's OWN publisher, in real PHP. Pinned to
  # a commit, read-only, and required: a missing prerequisite fails the job.
  php-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out fancy-cowork-php (pinned)
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-cowork-php
          ref: 0e113deb322ae39f84c7d611293024cb72b79910
          path: .fancy-cowork-php
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install fancy-cowork-php
        working-directory: .fancy-cowork-php
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # BRIDGE until fancy-ws 0.2.0 is on npm: package-lock.json resolves it
      # to a tarball built from a pinned commit (fancy-ws-candidate.json).
      # Delete this step with the bridge.
      - name: Build the fancy-ws candidate
        run: node scripts/fancy-ws-candidate.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Publisher interop
        env:
          FANCY_COWORK_PHP_DIR: ${{ github.workspace }}/.fancy-cowork-php
          FANCY_SOCKETS_REQUIRE_PHP: "1"
        run: npx vitest run test/php-publisher.test.ts

  # The README's GitHub Actions snippet, run as written (against this build
  # rather than npm), on the two runners it promises.
  ci-snippet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # BRIDGE until fancy-ws 0.2.0 is on npm: package-lock.json resolves it
      # to a tarball built from a pinned commit (fancy-ws-candidate.json).
      # Delete this step with the bridge.
      - name: Build the fancy-ws candidate
        run: node scripts/fancy-ws-candidate.mjs

      - name: Install and build
        run: npm ci --no-audit --no-fund && npx tsup

      - name: Start a Pusher-protocol socket server
        shell: bash
        run: |
          node dist/cli.js \
            --app ci-app:ci-key:ci-secret-0001:client-events \
            --port 6001 > sockets.log 2>&1 &
          for i in $(seq 1 50); do
            grep -q '"ready":true' sockets.log 2>/dev/null && break
            sleep 0.2
          done
          grep '"ready":true' sockets.log

      - name: It is still serving in a later step
        shell: bash
        run: node scripts/ci-probe.mjs ws://127.0.0.1:6001 ci-key
